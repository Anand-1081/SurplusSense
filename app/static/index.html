<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SurplusSense</title>
<meta name="theme-color" content="#1F5F4A">
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<style>
  html,body{margin:0;background:#F4F7F2}
  #boot{display:flex;align-items:center;justify-content:center;height:100vh;font:500 16px Roboto,system-ui,sans-serif;color:#1F5F4A}
  .logo-img{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
  .logo-link:hover .logo-img{transform:rotate(-8deg) scale(1.1)}
  .logo-link:active .logo-img{transform:scale(.92)}
  @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .pop{animation:pop .45s ease both}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"><div id="boot">Loading SurplusSense&hellip;</div></div>

<!-- Libraries load from a CDN (internet needed). Versions are pinned. -->
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mui/material@5.15.21/umd/material-ui.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<script type="text/babel" data-presets="react" src="/static/app.jsx"></script>
</body>
</html>
